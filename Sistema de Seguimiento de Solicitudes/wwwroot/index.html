    <script>
        function downloadFileFromBytes(filename, bytesBase64) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = "data:application/pdf;base64," + bytesBase64;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
    <script>
        window.downloadFileFromByteArray = function (options) {
            var blob = new Blob([new Uint8Array(options.byteArray)], { type: options.contentType });
            var link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = options.fileName;
            link.click();
        }
    </script>
